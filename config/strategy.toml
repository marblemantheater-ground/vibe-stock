# 이동평균 돌파 + 등락률 필터 전략 설정
# 값을 바꾸고 프로그램을 다시 시작하면 적용된다.

[ma_cross]
bar_minutes = 1            # 봉 단위(분): 1/2/3/5/10/15/30/60
short_window = 5           # 단기 이동평균 (봉 개수)
long_window = 20           # 장기 이동평균 (봉 개수, 119 이하)

# 매수 조건: 골든크로스 + 전일 대비 등락률(%)이 아래 범위 안
min_change_rate = 0.0
max_change_rate = 5.0

# 매도 조건: 매입평균가 대비 익절/손절(%) 또는 데드크로스
take_profit_pct = 3.0
stop_loss_pct = 2.0

# 1회 매수 예산 → 수량 = 예산 ÷ 현재가 (내림)
#   capital_usage_pct > 0: 거래일 시작 시 주문가능 USD × capital_usage_pct% ÷ max_positions 로 자동 계산
#                          (예: $100,000 × 50% ÷ 5종목 = 종목당 $10,000)
#   capital_usage_pct = 0: budget_per_trade_usd 고정 금액 사용
capital_usage_pct = 50
budget_per_trade_usd = 1000
max_positions = 5             # 동시에 보유할 최대 종목 수 (자금 분할 개수이기도 함)
cooldown_sec = 300            # 한 종목에서 신호가 난 뒤 다음 신호까지 대기(초)

# 신호를 낼 세션: "PRE"(프리마켓), "REGULAR"(정규장), "AFTER"(애프터마켓)
sessions = ["REGULAR"]

[order]
slippage_pct = 0.3          # 지정가 = 현재가 ± 0.3% (매수는 위, 매도는 아래) → 사실상 즉시 체결
order_timeout_sec = 60      # 이 시간 안에 체결되지 않으면 잔량 자동 취소
poll_interval_sec = 5       # 미체결 주문이 있을 때 체결내역 조회 주기(초)
max_orders_per_day = 20     # 하루 최대 주문 건수 (거부된 주문 제외)
max_buys_per_symbol = 1     # 한 종목을 하루에 매수할 수 있는 횟수 (손절 후 같은 날 재매수 방지, 0 = 제한 없음)
cancel_buy_above_limit = true  # 현재가가 매수 지정가 위로 오르면 미체결 매수를 시간 초과 전에 바로 취소
# 시작 시 계좌에 남아 있는 미체결 주문(이전 실행·HTS 직접 주문)은 항상 불러와 추적한다.
# true 로 하면 그 주문들을 바로 취소한다 (HTS 에서 직접 낸 주문도 취소되니 주의)
cancel_open_orders_on_start = false
dry_run = false             # true: 주문을 보내지 않고 로그만 남김
allow_real_trading = false  # 실전 계좌(KIS_ENV=real)에서 주문하려면 true 로 바꿔야 함

[screener]
# 장 마감 후 종목 선정 (python main.py --collect-daily → --screen)
ma_window = 120               # 이동평균 기간 (일)
min_price = 1.0               # 종가가 이 가격(USD) 미만이면 제외
liquidity_window = 20         # 평균 거래대금 계산 기간 (일)
min_avg_amount_usd = 1000000  # 평균 거래대금이 이 금액(USD) 미만이면 제외 (거래가 거의 없는 종목 배제)
below_days = 20               # 최근 이 기간(일)은 일봉 전체가 이평선 아래에 있어야 함
add_to_watchlist = true       # 다음 거래일에 선정 종목을 실시간 감시·매매 대상에 추가 (보유·미체결·관심 종목 다음 순위)
