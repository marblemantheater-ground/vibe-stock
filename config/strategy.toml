# 이동평균 돌파 + 등락률 필터 전략 설정
# 대시보드 설정 탭에서 바꾸거나 이 파일을 직접 고치면 실행 중에도 몇 초 안에 적용된다.
# (봉 단위·이동평균 기간과 [order] 의 dry_run / allow_real_trading / cancel_open_orders_on_start,
#  [screener]·[dashboard] 는 다음 거래일 또는 다음 실행부터)

[ma_cross]
bar_minutes = 1            # 봉 단위(분): 1/2/3/5/10/15/30/60
short_window = 5           # 단기 이동평균 (봉 개수)
long_window = 20           # 장기 이동평균 (봉 개수, 119 이하)

# 매수 조건: 골든크로스 + 전일 대비 등락률(%)이 아래 범위 안
min_change_rate = 0.0
max_change_rate = 5.0

# 매도 조건: 매입평균가 대비 익절/손절(%) 또는 데드크로스
take_profit_pct = 3.0
stop_loss_pct = 2.0

# 1회 매수 예산 → 수량 = 예산 ÷ 현재가 (내림)
#   capital_usage_pct > 0: 거래일 시작 시 주문가능 USD × capital_usage_pct% ÷ max_positions 로 자동 계산
#                          (예: $100,000 × 50% ÷ 5종목 = 종목당 $10,000)
#   capital_usage_pct = 0: budget_per_trade_usd 고정 금액 사용
capital_usage_pct = 100.0
budget_per_trade_usd = 1000
max_positions = 5             # 동시에 보유할 최대 종목 수 (자금 분할 개수이기도 함)
cooldown_sec = 300            # 한 종목에서 신호가 난 뒤 다음 신호까지 대기(초)

# 신호를 낼 세션: "PRE"(프리마켓), "REGULAR"(정규장), "AFTER"(애프터마켓)
sessions = ["PRE", "REGULAR"]

# 하루 목표·한도 (거래 옵션마다 다르게 둘 수 있음)
daily_profit_target_pct = 5.0 # 오늘 손익(실현+보유 평가)이 하루 시작 예수금(주문가능 USD)의 이 % 이상 → 보유 전부 매도, 그날 매매 종료 (0 = 끔)
max_buys_per_day = 50         # 하루 매수 횟수 한도 (0 = 제한 없음, 매도는 막지 않음)
# 스캘핑 (대시보드 스캘핑 탭·거래 옵션에서 설정하는 것을 권장)
entry_mode = "ma_cross"       # 진입 방식: ma_cross(이평 교차) / breakout(박스 돌파) / vwap(VWAP 눌림 반등) / orb(시가 범위 돌파)
breakout_bars = 5             # 박스 돌파: 직전 몇 개 봉의 최고가
orb_minutes = 10              # 시가 범위 돌파: 정규장 시작 후 몇 분
volume_mult = 0.0             # 돌파 봉 거래량이 평균의 몇 배 이상일 때만 (0 = 끔)
trailing_activate_pct = 0.0   # 추적 손절: 고점이 매입가 대비 이 % 오르면 켬 (0 = 끔)
trailing_pct = 1.0            # 추적 손절: 고점 대비 이 % 밀리면 매도
max_hold_min = 0              # 산 뒤 이 시간(분)이 지나면 매도 (0 = 끔)
flatten_before_close_min = 0  # 마지막 선택 세션 종료 이 시간(분) 전 전부 매도 + 매수 중지 (0 = 끔)
min_strength = 0.0            # (실시간만) 체결강도 하한 (0 = 끔)
max_spread_pct = 0.0          # (실시간만) 호가 스프레드 상한 % (0 = 끔)
rebuy_wait_sec = 30           # 같은 종목 매도 체결 후 다시 살 때까지 대기(초) (0 = 바로 가능, 같은 날 재매수는 [order] max_buys_per_symbol 도 2 이상)

[order]
slippage_pct = 0.3          # 지정가 = 현재가 ± 0.3% (매수는 위, 매도는 아래) → 사실상 즉시 체결
order_timeout_sec = 60      # 이 시간 안에 체결되지 않으면 잔량 자동 취소
poll_interval_sec = 3       # 미체결 주문이 있을 때 체결내역 조회 주기(초)
max_orders_per_day = 50     # 하루 최대 주문 건수 (모든 옵션 공통 안전 한도, 거부 제외). 닿으면 매수만 막고 매도는 계속
max_buys_per_symbol = 0     # 한 종목을 하루에 매수할 수 있는 횟수 (손절 후 같은 날 재매수 방지, 0 = 제한 없음)
cancel_buy_above_limit = true  # 현재가가 매수 지정가 위로 오르면 미체결 매수를 시간 초과 전에 바로 취소
# 시작 시 계좌에 남아 있는 미체결 주문(이전 실행·HTS 직접 주문)은 항상 불러와 추적한다.
# true 로 하면 그 주문들을 바로 취소한다 (HTS 에서 직접 낸 주문도 취소되니 주의)
cancel_open_orders_on_start = false
dry_run = false             # true: 주문을 보내지 않고 로그만 남김
allow_real_trading = false  # 실전 계좌(KIS_ENV=real)에서 주문하려면 true 로 바꿔야 함

[risk]
# 손실 차단 장치. 총자산 = 주문가능 USD + 보유 평가금액(실시간 체결가 기준)
# action: "block_buys" = 신규 매수만 중지 (익절·손절 매도는 계속)
#         "liquidate"  = 미체결 전부 취소 + 보유 전부 매도 + 신규 매수 중지
daily_loss_limit_pct = 5.0         # 오늘 시작 총자산 대비 이만큼(%) 잃으면 그날 매매 중지 (다음 거래일 자동 해제, 0 = 끔)
daily_loss_action = "block_buys"
max_drawdown_pct = 15.0            # 고점(일별 마감 총자산 최고치) 대비 이만큼(%) 빠지면 매매 중지 (--resume 까지 유지, 0 = 끔)
max_drawdown_action = "block_buys"
confirm_sec = 10                   # 한도 초과가 이 시간(초) 이어져야 발동 (순간적인 이상 시세 무시)
liquidation_slippage_pct = 1.0     # 청산 매도 지정가 = 현재가 - 1% (빨리 팔리도록)
# 긴급 정지: run.bat --kill (또는 kill.bat 더블클릭) → 미체결 취소 + 전부 매도 + 매수 중지
# 해제: run.bat --resume   /   상태 확인: run.bat --risk-status

[fees]
# 연간 정산(수수료·세금 추정)에만 쓰인다. 매매에는 영향 없음. 증권사 등급·이벤트·시기에 따라 다르니 실제 값으로 바꿔 쓴다
commission_pct = 0.25              # 매매 수수료(%) — 매수·매도 금액에 각각
sec_fee_per_million = 27.8         # SEC 수수료: 매도 금액 $1,000,000 당 $ (매도만)
finra_taf_per_share = 0.000166     # FINRA TAF: 매도 1주당 $ (매도만)
finra_taf_max = 8.3                # FINRA TAF 주문 1건당 상한 $

[tax]
# 해외주식 양도소득세 추정 (결제일 기준 연도, 같은 해 손익 상계, 다음 해 5월 확정신고)
cost_method = "fifo"               # 취득가 계산: "fifo" 선입선출 / "average" 이동평균
basic_deduction_krw = 2500000      # 기본공제 (연 250만원)
tax_rate_pct = 22.0                # 양도소득세 20% + 지방소득세 2%

[backtest]
# 백테스트용 1분봉 (data/minute/). KIS 는 최근 약 한 달치만 주므로 매일 이어 받아 기간을 늘린다
collect_after_close = true         # 거래일이 끝나면 관심·선정·저장 중인 종목의 분봉을 이어 받기
collect_days = 22                  # 처음 받을 때 거슬러 올라갈 거래일 수

[dashboard]
# 매매 프로그램이 실행되는 동안 브라우저 화면 제공: http://127.0.0.1:8765 (이 PC 에서만 접속)
# 로그인 비밀번호는 .env 의 DASHBOARD_PASSWORD
enabled = true
port = 8765

[screener]
# 장 마감 후 종목 선정 (python main.py --collect-daily → --screen)
ma_window = 120               # 이동평균 기간 (일)
min_price = 1.0               # 종가가 이 가격(USD) 미만이면 제외
liquidity_window = 20         # 평균 거래대금 계산 기간 (일)
min_avg_amount_usd = 1000000  # 평균 거래대금이 이 금액(USD) 미만이면 제외 (거래가 거의 없는 종목 배제)
below_days = 20               # 최근 이 기간(일)은 일봉 전체가 이평선 아래에 있어야 함
add_to_watchlist = true       # 다음 거래일에 선정 종목을 실시간 감시·매매 대상에 추가 (보유·미체결·관심 종목 다음 순위)
